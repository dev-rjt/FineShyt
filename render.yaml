services:
  - type: web
    name: verdant-green-insights
    runtime: python
    plan: free
    buildCommand: pip install -r product_app/requirements.txt -r product_app/requirements-app.txt
    startCommand: bash product_app/start_hosted.sh
    healthCheckPath: /_stcore/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: BANK_DEMO_ID
        value: bank_manager
      - key: BANK_DEMO_PASSWORD
        sync: false
      - key: CUSTOMER_DEMO_ID
        value: C12558
      - key: CUSTOMER_DEMO_PASSWORD
        sync: false
      - key: APP_SESSION_SECRET
        generateValue: true
      - key: API_BASE_URL
        value: http://127.0.0.1:8000
      - key: API_PORT
        value: 8000
      - key: OLLAMA_API_KEY
        sync: false
      - key: OLLAMA_BASE_URL
        value: https://ollama.com
      - key: OLLAMA_MODEL
        value: gemma4:31b
      - key: OLLAMA_ALLOW_LAN
        value: false
