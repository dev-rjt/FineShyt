services:
  api:
    build: .
    ports:
      - "8000:8000"
    env_file: .env
    environment:
      PYTHONPATH: /app/src
    volumes:
      - ./src:/app/src
    depends_on:
      - db
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: megathon
      POSTGRES_PASSWORD: megathon
      POSTGRES_DB: megathon
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
volumes:
  pgdata:
